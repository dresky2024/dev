name: DevOps Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Проверяем код репозитория
      uses: actions/checkout@v4

    - name: Авторизация в Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Сборка и отправка образа в Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: xxnb22/my-awesome-site:latest

    - name: Уведомление об успехе в Telegram
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO_RECIPIENT }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🚀 Сборка XXNB успешно завершена!
          Репозиторий: ${{ github.repository }}
          Коммит: ${{ github.event.head_commit.message }}
          Новый Docker-образ уже в облаке.

    - name: Уведомление об ОШИБКЕ в Telegram
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO_RECIPIENT }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ❌ Внимание! Пайплайн XXNB СЛОМАЛСЯ!
          Репозиторий: ${{ github.repository }}
          Автор коммита: ${{ github.actor }}
          Срочно проверьте логи GitHub Actions!
